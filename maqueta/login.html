<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <div class="card">
      <p class="mark">Shared Space Manager</p>
      <a href="./index.html" class="back-btn">Volver al Inicio</a>
      <h1>Iniciar Sesión</h1>

      <div class="field">
        <label for="email">Correo</label>
        <input
          id="email"
          type="email"
          placeholder="tu@correo.com"
          autocomplete="email"
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <a class="forgot" href="#">¿Olvidaste tu contraseña?</a>

      <button type="button">Entrar</button>

      <p class="signup">
        ¿No tenes cuenta? <a href="./register.html">Regístrate</a>
      </p>
    </div>
  </body>
</html>
