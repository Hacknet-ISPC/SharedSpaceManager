<header class="mb-4">
  <h1 class="fw-bold h2 mb-1">Nueva <span style="color:var(--primary)">Reserva</span></h1>
  <p class="text-secondary mb-0">Elegí la cancha, el día y el horario que necesitás.</p>
</header>

<form [formGroup]="reservaForm" (ngSubmit)="onSubmit()" class="row g-3">

  <div class="col-12">
    <label for="cancha" class="form-label">Cancha</label>
    <select id="cancha" class="form-select" formControlName="cancha"
      [class.is-invalid]="reservaForm.controls.cancha.touched && reservaForm.controls.cancha.invalid">
      <option value="">Elegí una cancha</option>
      @for (c of canchas(); track c.id) {
      @if (c.estado === 'disponible') {
      <option [value]="c.id">{{ c.nombre }} · {{ c.tipo_nombre }}</option>
      }
      }
    </select>
    <div class="invalid-feedback">Seleccioná una cancha.</div>
  </div>

  <div class="col-12 col-md-4">
    <label for="fecha" class="form-label">Fecha</label>
    <input id="fecha" type="date" class="form-control" formControlName="fecha" [min]="hoy"
      [class.is-invalid]="reservaForm.controls.fecha.touched && reservaForm.controls.fecha.invalid" />
    <div class="invalid-feedback">Elegí una fecha.</div>
  </div>

  <div class="col-6 col-md-4">
    <label for="horaInicio" class="form-label">Hora de inicio</label>
    <input id="horaInicio" type="time" step="1800" class="form-control" formControlName="horaInicio"
      [class.is-invalid]="reservaForm.controls.horaInicio.touched && reservaForm.controls.horaInicio.invalid" />
    <div class="invalid-feedback">Indicá la hora de inicio.</div>
  </div>

  <div class="col-6 col-md-4">
    <label for="duracion" class="form-label">Duración</label>
    <select id="duracion" class="form-select" formControlName="duracion">
      @for (d of duraciones; track d.minutos) {
      <option [ngValue]="d.minutos">{{ d.etiqueta }}</option>
      }
    </select>
  </div>

  @if (error()) {
  <div class="col-12">
    <div class="alert alert-danger mb-0" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ error() }}
    </div>
  </div>
  }

  <div class="col-12 d-flex gap-2 flex-wrap">
    <button type="submit" class="btn btn-primary text-white" [disabled]="enviando()">
      <i class="bi bi-calendar-check me-1"></i>
      {{ enviando() ? 'Reservando...' : 'Confirmar reserva' }}
    </button>
    <a routerLink="/user/mis-reservas" class="btn btn-outline-secondary">Cancelar</a>
  </div>
</form>
