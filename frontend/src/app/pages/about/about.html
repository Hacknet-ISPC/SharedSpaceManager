<header class="page-header">
  <div class="container">
    <h1>Nuestro Equipo</h1>

    <p>
      Somos un grupo de desarrolladores apasionados por crear soluciones tecnológicas que faciliten
      la colaboración.
    </p>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="row g-4 justify-content-center">
      @for (desarrollador of desarrolladores(); track desarrollador.id_desarrollador) {
        <div class="col-md-6 col-lg-4">
          <div class="card team-card h-100">
            <div class="card-body">
              <img [src]="desarrollador.foto" class="team-avatar" alt="Imagen Miembro del Equipo" />
              <h2>{{ desarrollador.nombre }}</h2>
              <p class="team-role">{{ desarrollador.rol }}</p>

              <a
                [href]="desarrollador.linkedin"
                target="_blank"
                rel="noopener noreferrer"
                class="linkedin-link"
              >
                <i class="bi bi-linkedin"></i>
                LinkedIn
              </a>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
